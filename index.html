
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Smart Task Manager</h1>
        <p class="subtitle">Plan your day. One task at a time.</p>

        <div class="task-form">
            <input type="text" id="task-input" placeholder="Enter your task...">
            <button type="button" id="add-task">Add Task</button>
        </div>

        <div class="summary">
            <span id="task-count">0 tasks</span>
            <span id="completed-count">0 completed</span>
        </div>

        <ul id="task-list"></ul>

        <p id="empty-message">No tasks yet. Add your first task!</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
